<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada - Probakgo</title>
  <script nonce="{{.CSPNonce}}">(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%233b82f6' d='M2 2a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm10.5 3a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m1.5 0a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1M2 9a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2zm10.5 3a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m1.5 0a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1'/></svg>">
</head>
<body>
  <main class="not-found-page">
    <section class="not-found-card" aria-labelledby="notFoundTitle">
      <a href="/" class="not-found-brand text-decoration-none" aria-label="Probakgo">
        <span class="not-found-brand-icon"><i class="bi bi-hdd-rack-fill"></i></span>
        <span>Probakgo</span>
      </a>

      <div class="not-found-visual" aria-hidden="true">
        <span class="not-found-code">404</span>
        <span class="not-found-status"><i class="bi bi-plug"></i></span>
      </div>

      <p class="not-found-eyebrow">RECURSO NO DISPONIBLE</p>
      <h1 id="notFoundTitle">Página no encontrada</h1>
      <p class="not-found-copy">La dirección solicitada no existe, ha cambiado o ya no está disponible.</p>
      {{if .Path}}<code class="not-found-path">{{.Path}}</code>{{end}}

      <div class="not-found-actions">
        <a href="/" class="btn btn-primary"><i class="bi bi-speedometer2 me-2"></i>Ir al dashboard</a>
        {{if .LoggedIn}}
        <a href="/alerts" class="btn btn-secondary"><i class="bi bi-bell me-2"></i>Ver alertas</a>
        {{else}}
        <a href="/login" class="btn btn-secondary"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión</a>
        {{end}}
      </div>
    </section>
  </main>
</body>
</html>
