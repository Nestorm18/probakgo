name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Read version
        id: version
        run: |
          APP_VERSION=$(grep -oP 'var Version = "\K[^"]+' internal/version/version.go)
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid version in internal/version/version.go: $APP_VERSION"
            exit 1
          fi
          echo "Version: $APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test and enforce coverage floor
        shell: bash
        run: |
          go test -coverprofile=coverage.out ./...
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Total coverage: ${TOTAL}%"
          awk -v total="$TOTAL" 'BEGIN { if (total + 0 < 35) exit 1 }'

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.build.outputs.version }}
      sha: ${{ github.sha }}
